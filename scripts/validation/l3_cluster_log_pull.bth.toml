[validation]
property = "A SLURM job's log-mode run, pulled home with bth's cluster run-log pull via myxcel pull-path and ingested, is visible to get_run; a bad remote root lands in failures, not pulled"
reference = "spec 261012_retire-compact-runlog-cutover B0.3; fixture: scratch project bth-l3-scratch on engaging, remote_root written ABSOLUTE (/home/maarxaru/projects/bth-l3-scratch) because installed myxcel b5648b5 refuses ~/projects/... roots (spiked 261012, dry-run refused)"
tolerance = "exact: all three booleans true; no tolerance"

[outcomes.pass]
condition = "log_pulled AND neg_log_failed AND fixture_visible"
decision = "B0.3 met for absolute remote roots; fix the ~/projects remote-root refusal in myxcel before cut-over, then close bathos #1993"
reasoning = "All three links (pull brings the log home, a bad root is reported as a failure, ingest makes the run readable) are required for a post-cut-over cluster run to be both visible and honestly reported"

[outcomes.fail]
condition = "NOT (log_pulled AND neg_log_failed AND fixture_visible)"
decision = "Cut-over stays blocked; diagnose from failure_errors / pulled files before any retry"
reasoning = "Any broken link means cluster runs after cut-over would be invisible locally or silently reported as pulled"

[outcomes.residual]
condition = "TRUE"
decision = "Results did not evaluate (missing or null fields); treat as fail and inspect the script output"
reasoning = "Catch-all so a malformed result is never mislabelled pass"
is_residual = true

[result_schema]
pulled_labels = "str"
failure_labels = "str"
failure_errors = "str"
log_pulled = "bool"
neg_log_failed = "bool"
n_pulled_files = "int"
fixture_visible = "bool"
fixture_project_slug = "str"
fixture_status = "str"
remote_root = "str"
