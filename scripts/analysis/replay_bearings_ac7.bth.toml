# Approved by the owner 261104 (AskUserQuestion) and committed before any packet was built.
[experiment]
hypothesis = """A blind reader given only primary records finds several concurrent project-level purposes in colliculix before its drift diagnosis, and does not find them in two projects with no diagnosed drift (spec 261104, AC-7, assumption A9).

Positive control: colliculix at commit 14c3804, the tree before the refoundation handoff 24ef9a6 and the charter draft 588d175. The diagnosis (colliculix memory, 2026-07-07) names seven purposes: (A) cascade router, (B) praxia crystallize/remelt cost gate, (C) MTT/rhizome program, (D) SWE-bench recon line, (E) contamination-immune methodology paper, (F) semantic compiler vision, (G) interpretability mandate.

Negative controls, named by the owner: tev_design at b2b5386f and plegadx at 1472ee54, each over the 28 days before the commit. tev_design is a hard negative. Classified before any reading is seen: the k=4 vs k=9 episode and the target swap of 260714 are claim-scale slips inside one project aim, so a reader that reports them as separate project purposes has raised a false alarm, and the owner labels those entries as sub-lines. Confirmed by the owner 261104.

Disclosures. The positive control was chosen after the fact, and this sidecar's author has read the diagnosis, which is why the negative controls and owner labels exist. The owner also knows the diagnosis and cannot be blind to which project a reading describes. Three readers per arm is a small sample that shows consistency, not a rate. The reader is one model on one prompt, so a pass says nothing about other readers.

Departure from the spec's AC-7 wording, approved by the owner 261104. AC-7 says the packet reads only history reachable from the cut. Docs and git subjects do. Runs do not: design probes on 261104 found 5 of 35 colliculix runs, 4 of 101 tev_design runs and 77 of 95 plegadx runs reachable, because most runs happened on branches or dirty snapshots. Requiring reachability would remove most of the record the reader is meant to see, and colliculix's drift lived partly on unmerged branches. Runs are therefore bounded by time, every run predates the cut, and contamination is tested directly by the grep below.

Amendment 261105, approved by the owner, committed before the second set of readers and before anything was labelled or scored. The first nine readers read little of the record: 3-6 of 48 docs on plegadx and 0-5 sidecars on any arm, because the prompt did not explain the sidecar path or ask for a full read. One used Bash, and the audit forbids that. Their readings are kept in outputs/ac7/readings_attempt1 and are not scored. The prompt now explains the path and asks for a full read. The audit now also allows SubagentHandback, the harness tool that returns a reader's final report and reads no project data. The result gains descriptive coverage fields, which gate nothing. Conditions and thresholds are unchanged. Readers carry the neutral task id 261104_project-reading and the dispatch header the hook requires. The author saw one first-attempt reader's short summary (colliculix reader 2) and no other reading text; the prompt change was made because of coverage, not because of any reading's content.

Second amendment 261105, committed before anything was labelled or scored; the owner is told in the same report. In the second set every reader opened every doc and sidecar in its packet. Five readers used Edit, all on their own reading file (checked from the transcripts), to correct their own output, so the audit allows Edit, and the path check still confines it to that file. plegadx reader1 had one citation that did not resolve, so it gets the one disclosed redo with a fresh agent, and its first output is kept in readings_attempt2. Conditions and thresholds are unchanged. The actual working directory is ~/scratch/ac7, not outputs/ac7, because the worktree path named the feature under test and could prime a reader. The author also saw short second-attempt summaries from two tev_design readers and one plegadx reader, which list their purposes, and no other reading text.

Third amendment 261105, committed before anything was labelled or scored; requested by the owner, who is told in the same report. Labelling moves from a local page to a private Claude artifact, whose labels save to its database and are exported to labels.json by replay_bearings_ac7_label_page.py --export-from. Publishing an artifact requires its author to read what it publishes, so the author has now read the full text of all nine readings. The author labels nothing, and the conditions, thresholds, label meanings and readings are unchanged. New page aids: name chips, optional fill of a name from a ticked A-G purpose (the owner can edit it), and a project-wide rename. The page shows no per-reader counts, so the score stays hidden during labelling. An entry's only pre-filled state is empty.

Fourth amendment 261105, requested by the owner, committed before any juror ran and before anything was scored. A jury labels the entries, and the owner decides only what the jury cannot settle. The owner had saved two labels by then, and they stand. Jury: two Cursor and two Antigravity agents at the standard tier, using praxia's completion role, each in an empty folder with the prompt as its only intended input. Round one labels all 102 entries and is not shown A-G, this hypothesis, the conditions or the thresholds. Round two uses fresh agents, one per juror, and maps the colliculix entries to A-G. Jurors see entry text but not citations, so they judge scale and cannot re-check support against the record; citations were already resolved mechanically. An entry goes to the owner if the jurors' choices differ, any juror marks it uncertain, jurors group it differently from another entry of the same reader, or their A-G ticks differ. Everything else takes the jury's label. Audit: 10 unflagged entries, drawn with seed 261105, go to the owner mixed in with the flagged ones and without the jury's votes. If the owner overturns 3 or more of the 10, jury labels are discarded, the owner labels every entry, and nothing is scored from jury labels. The 3 is a judgment cutoff with no empirical basis. A juror with an invalid verdict gets one redo; the round then proceeds only with a valid juror from each surface, and any shortfall is disclosed. This weakens one safeguard: the labels were meant to come from the owner, and four language models can share a bias that unanimity would hide. The audit is the only check on that. Cursor's and Antigravity's tool logs cannot be verified by praxia, so staying inside the empty folder is instructed, not proven. Conditions and thresholds are unchanged. Pilot note, committed before the redo: the first Cursor and first Antigravity label verdicts returned every row but were rejected, because the prompt did not ask for the {"rows": [...]} wrapper the schema requires. Those two jurors get their one redo with the corrected prompt, and all other jurors get the corrected prompt. The dispatch tool printed both rejected verdicts to the author, so the author has seen them; they are kept in the dispatch records and are not used.

Fifth amendment 261105, chosen by the owner after the jury ran and before anything was scored. The pre-registered rule flagged 69 of 102 entries, 57 of them because a single juror marked uncertainty, while 17 had real disagreement, so the owner changed it. An entry now goes to the owner if the jurors' choices differ, their A-G ticks differ, their grouping differs, or at least 3 of the 4 jurors in a round mark it uncertain (33 entries). This changes a pre-registered rule after seeing flag counts by reason, though not per-reader counts or any score. The author had seen two rejected pilot verdicts and the grouping-pair count (21 pairs, none grouped differently). The audit is drawn from the unflagged entries under this rule, so it covers entries marked uncertain by 1 or 2 jurors. A rejection whose only reason is another dispatch's leftover rollback patch does not invalidate a verdict: label_agy1 was rejected only for its own pilot's patch file, and its verdict is kept. The owner's page offers the first juror's purpose names as suggestions without saying which entries they came from, and its fill of a name from an A-G tick is removed. Conditions and thresholds are unchanged.

Sixth amendment 261105, chosen by the owner after seeing flag counts by reason and before anything was scored. The owner decides only entries where the jurors' label choices differ or at least 3 of 4 jurors mark the label uncertain (or grouping differs, which is empty). A-G ticks are no longer sent to the owner: each colliculix entry's ticks are the union of the four mapping jurors' ticks and any tick the owner already saved. The audit is removed, so nothing now checks the entries the owner does not see for a bias shared by the jurors, and a unanimous, confident label is accepted unchecked. The union is the most generous count of A-G and raises colliculix_recovered_median relative to any stricter rule, which favours the pass condition. To show the size of that, recovered under ticks chosen by at least 3 of 4 jurors is reported beside the result; this figure is descriptive and gates nothing, and the outcome is decided by the union. Juror disagreement and uncertainty on ticks stay on record in merged.json. Conditions and thresholds are unchanged.

Protocol. (1) Commit this sidecar. (2) Run the script with --build-only. (3) Run three fresh Sonnet readers per arm, each with the committed prompt scripts/analysis/replay_bearings_ac7_reader_prompt.md, filling in only its paths and ids, each writing outputs/ac7/readings/<arm>/<reader>.json. A rejected reading gets one redo, which is disclosed. (4) The owner labels every entry into outputs/ac7/labels.json. (5) bth run this script. The result is reported either way."""
stage_name = "validation"
novel = true

[outcomes.instrument_broken]
condition = "NOT controls_ok OR contamination_hits > 0 OR packet_hash_mismatches > 0 OR reader_audit_violations > 0 OR rejected_readings > 0 OR n_readings <> 9 OR n_unlabelled > 0"
decision = "The run is invalid: report it, cite no number from it, fix the cause, and pre-register a new run."
reasoning = "The scorer failed its synthetic controls, the positive control saw the diagnosis, a packet did not rebuild to its hash on real data, a reader opened something outside its packet, or a reading or label is missing or invalid."

[outcomes.pass]
condition = "colliculix_recovered_median >= 4 AND tev_design_identities_median <= 2 AND plegadx_identities_median <= 2 AND colliculix_identities_median > greatest(tev_design_identities_median, plegadx_identities_median)"
decision = "A9 stands for this reader and prompt. Build slice 3, and open T1 (the shadow-exit numbers) with these readings as the first calibration."
reasoning = "4 of 7 and at most 2 are judgment cutoffs with no empirical basis. 4 is a majority of the diagnosed purposes, enough to read as several concurrent purposes rather than a chance match. 2 allows a project one honest secondary aim. The last clause requires the reader to separate the arms. The readings themselves matter more than the label."

[outcomes.marginal]
condition = "colliculix_recovered_median >= 2 AND colliculix_identities_median > greatest(tev_design_identities_median, plegadx_identities_median)"
decision = "The owner reads the readings before anything else is built. Any change to the prompt or the packet needs a new pre-registration."
reasoning = "The reader separates the arms but recovers little, or it raises more project-level purposes on a negative control than the pass allows. Either could be a fixable prompt or a limit of the method, and this run cannot say which."

[outcomes.fail]
condition = "NOT (colliculix_recovered_median >= 2 AND colliculix_identities_median > greatest(tev_design_identities_median, plegadx_identities_median))"
decision = "Do not build slice 3 on the blind reader. Bring the readings to the owner and re-open whether a cold reader is the right mechanism."
reasoning = "The reader missed the drift, or found as much on projects without it, so its disagreement with a charter could not be told apart from noise. This is the pre-mortem's second failure path."
is_residual = true

[result_schema]
controls_ok = "bool"
contamination_hits = "int"
packet_hash_mismatches = "int"
reader_audit_violations = "int"
rejected_readings = "int"
n_readings = "int"
n_unlabelled = "int"
colliculix_recovered_median = "float"
colliculix_identities_median = "float"
tev_design_identities_median = "float"
plegadx_identities_median = "float"
colliculix_unresolved_sidecars = "int"
tev_design_unresolved_sidecars = "int"
plegadx_unresolved_sidecars = "int"
colliculix_min_docs_read_frac = "float"
tev_design_min_docs_read_frac = "float"
plegadx_min_docs_read_frac = "float"
colliculix_min_sidecars_read_frac = "float"
tev_design_min_sidecars_read_frac = "float"
plegadx_min_sidecars_read_frac = "float"
