# PROVISIONAL DRAFT for AC-9 (spec 261104, T7). Not confirmed by the owner. Nothing live may run on it.
# Purpose ids are readable slugs (owner 261109): sidecars name them in `[charter] purpose = "<slug>"`.
# Former ids: L1 chory-libraries, L2 mpnn-design, L3 assembly-method, L4 size-selections, L5 lagoon-simulation,
# L6 active-learning, L7 distal-local-specificity, R1 degenerate-codon-libraries, R2 qmmm-reaction-states.
# mpnn-design through active-learning are the assistant's reading of tev_design's AGENTS.md and the AC-7e sidecar,
# kept by the owner 261109 as drafted. chory-libraries was rewritten and distal-local-specificity added by the owner 261109.
# distal-local-specificity is "not an immediate goal"; the format has only live/retired, so it is marked live (owner to confirm).
# Two retired purposes: degenerate-codon-libraries and qmmm-reaction-states (chosen by the owner 261109, wording provisional).
# The tev_design split is being scoped; this charter covers the repo as one project.
mandate = "Build a scarless TEV: broaden the S1' pocket while preserving S1 Gln specificity and catalysis, through a multi-prong library program for the Chory collaboration. (PROVISIONAL: the project's real goals are multipronged and differ.)"

[purpose.chory-libraries]
text = "Deliver the Chory collaborator libraries: scarless TEV stretch goal, up to 96 libraries subjected to multiplex selection, demonstrating turboPRANCE multiplexability."
state = "live"

[purpose.mpnn-design]
text = "Design TEV variant sequences: MPNN arms with fixed or mutated residue shells (protection versus enrichment masks)."
state = "live"

[purpose.assembly-method]
text = "Choose and score the assembly method: fragment boundaries, junctions and junction crosstalk."
state = "live"

[purpose.size-selections]
text = "Size the selections: coverage, bottleneck and sequencing depth."
state = "live"

[purpose.lagoon-simulation]
text = "Simulate continuous selection in the lagoon."
state = "live"

[purpose.active-learning]
text = "Active learning over designs."
state = "live"

[purpose.distal-local-specificity]
text = "Distal versus local mutation impact on specificity (not an immediate goal)."
state = "live"

[purpose.degenerate-codon-libraries]
text = "Degenerate-codon (NNK/NNS) site-saturation libraries."
state = "retired"
retired_reason = "No amber suppression in the selection strain; an oPool is defined oligos, so degenerate codons waste budget (decided 2026-08-31; tev_design reference 261007_no-amber-suppression)."

[purpose.qmmm-reaction-states]
text = "Extra QM/MM sampling to generate reaction-state backbone diversity for multistate design."
state = "retired"
retired_reason = "The two reaction states differ by 0.0184 A backbone RMSD because the backbone does not move along the reaction coordinate; more QM/MM gives backbone-uncertainty regularization, not multistate design (tev_design decision 260817_multistate-ensemble-generation-options, final). PROVISIONAL wording, owner to confirm."
