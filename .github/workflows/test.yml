name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.13
      - name: Install dependencies
        # --all-extras, not plain --dev: tests/test_stats_gates.py imports the scipy-backed
        # gates unguarded, so without the `stats` extra 15 tests fail outright. The viz tests
        # do guard (importorskip), so they silently skipped instead — untested in CI since the
        # suite was added. Installing every extra keeps new extras from repeating either.
        run: uv sync --all-extras --dev
      - name: Lint with ruff
        run: uv run ruff check src tests
      - name: Run tests with coverage
        run: uv run pytest --cov=bathos --cov-report=term-missing -v
