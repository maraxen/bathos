name: Test

on:
  push:
    branches:
      - main
  # No `branches:` filter. It used to be `[main]`, which meant a PR based on
  # anything else got no checks at all — #39 was stacked on another fix branch
  # and ran zero times until it was briefly retargeted by hand. Filtering the
  # base branch silently withholds CI from exactly the stacked PRs that most
  # need it, so every PR now gets a run regardless of where it lands.
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.13
      - name: Install dependencies
        # --all-extras, not plain --dev: tests/test_stats_gates.py imports the scipy-backed
        # gates unguarded, so without the `stats` extra 15 tests fail outright. The viz tests
        # do guard (importorskip), so they silently skipped instead — untested in CI since the
        # suite was added. Installing every extra keeps new extras from repeating either.
        run: uv sync --all-extras --dev
      - name: Lint with ruff
        run: uv run ruff check src tests
      # Every check below runs even when an earlier one fails. A failing step
      # normally short-circuits the rest, and GitHub reports those as `skipped`
      # — visually identical to a step that was never going to run. That cost
      # this repo months: the pyright step "passed" for its whole life because
      # an earlier step always failed first, and nobody could tell. One run
      # should report every problem it can see, not just the first.
      - name: Type-check with ty
        if: ${{ !cancelled() }}
        run: uv run ty check src
      - name: Run tests with coverage
        if: ${{ !cancelled() }}
        run: uv run pytest --cov=bathos --cov-report=term-missing -v
