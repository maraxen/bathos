[plugin]
name            = "bathos"
version         = "0.5.4"
description     = "Experiment tracking — pre-registration, provenance, campaigns"
requires_praxia = ">=1.0"
# Skills reach Claude Code only via the plugin bundle (bathos:<skill>); skip
# praxia's legacy copy into ~/.claude/skills, which duplicated every listing.
skills_delivered_by_plugin = true
# Declares bathos as a provider of the generic praxia "readback" capability
# (praxia-plugin-readback: resolve_pin/get_trust_state/query_attestation/
# figure_lookup — all already live MCP tools on bth-mcp below, S1/S4/S7).
# Consumers resolve this via
# praxia_workflows::plugin_cli::resolve_plugin_mcp_command_for_capability
# ("readback") rather than naming "bathos" directly — see praxia backlog
# #3499 / PR maraxen/praxia#22.
provides = ["readback"]

[plugin.mcp]
# `bth serve` never existed as a CLI subcommand — the real MCP launch
# mechanism is the `bth-mcp` console-script entry point (pyproject.toml
# [project.scripts]), which starts bathos.mcp:mcp_server() on stdio
# transport. bathos.export.register_mcp() resolves the same binary
# (shutil.which("bth-mcp"), falling back to `uv run --with bathos[mcp]
# bth-mcp`) when writing mcpServers.bathos into a caller's MCP config.
# Fixed as part of debt #619 (MCP write-seam auth hardening).
command = ["bth-mcp"]
# The plugin bundle (plugin/, installable from GitHub) runs the server via
# `uvx --from bathos==<this release> bth-mcp`, so a GitHub-installed plugin
# needs no prior `uv tool install bathos` and always matches its own release.
launch = "uvx"

# NOTE: `triggers` below is human-readable documentation only — cisternal's
# ManifestAssetSource._load_skills() (assets/manifest.py) reads only `name`
# and `path` from each [[plugin.skills]] entry; `triggers` is never consumed.
# The triggers Claude actually sees come solely from the `description`/
# `triggers` fields in each skill file's own YAML frontmatter (linked below).
# Keep the two in sync by hand until cisternal's loader grows support for
# manifest-declared triggers.
#
# Paths below are repo-root-relative (not `../`-prefixed): cisternal>=0.1.1a4
# resolves ManifestAssetSource paths from the manifest file's grandparent
# directory (i.e. repo root for `.praxia/manifest.toml`), matching praxia's
# own resolution of this same manifest. Earlier `../agent_assets/...` paths
# were a workaround for 0.1.1a3's now-fixed single-parent resolution bug.
[[plugin.skills]]
name     = "using-bathos"
path     = "agent_assets/skills/using-bathos/SKILL.md"

[[plugin.skills]]
name     = "bathos-cluster"
path     = "agent_assets/skills/bathos-cluster/SKILL.md"

[[plugin.skills]]
name     = "bathos-campaigns"
path     = "agent_assets/skills/bathos-campaigns/SKILL.md"

[[plugin.skills]]
name     = "bathos-rigor-gates"
path     = "agent_assets/skills/bathos-rigor-gates/SKILL.md"

[[plugin.skills]]
name     = "bathos-literature-parity"
path     = "agent_assets/skills/bathos-literature-parity/SKILL.md"

[[plugin.skills]]
name     = "bathos-mcp"
path     = "agent_assets/skills/bathos-mcp/SKILL.md"

[[plugin.skills]]
name     = "bathos-trust-ledger"
path     = "agent_assets/skills/bathos-trust-ledger/SKILL.md"

[[plugin.skills]]
name     = "bathos-blast-radius"
path     = "agent_assets/skills/bathos-blast-radius/SKILL.md"

[[plugin.skills]]
name     = "bathos-step-back"
path     = "agent_assets/skills/bathos-step-back/SKILL.md"

[[plugin.skills]]
name     = "prose-biosafe"
path     = "agent_assets/skills/prose-biosafe/SKILL.md"

[[plugin.agents]]
name  = "experiment-runner"
path  = "agent_assets/agents/experiment-runner.md"
tools = ["run", "campaign_create", "campaign_review", "check"]


# PreToolUse backstop (spec 261016 P1): runs `bth preflight --command` before a job submission that
# bypasses `bth submit` (sbatch, myxcel submit-job, the myxcel MCP submit_job tool) and denies the
# call when the [requires]/[budget] preflight blocks. It is a backstop, not the gate: `bth submit`
# runs the same check in-process. stdlib-only (bathos startup is heavy and the hook runs before
# every matching call). One regex matcher covers both tool families; cisternal copies it verbatim.
[[plugin.hook_specs]]
event    = "PreToolUse"
matcher  = "Bash|mcp__.*__submit_job"
script   = "bth-preflight-hook"
surfaces = ["claude"]
