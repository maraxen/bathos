[plugin]
name            = "bathos"
version         = "0.5.0"
description     = "Experiment tracking — pre-registration, provenance, campaigns"
requires_praxia = ">=1.0"
# Declares bathos as a provider of the generic praxia "readback" capability
# (praxia-plugin-readback: resolve_pin/get_trust_state/query_attestation/
# figure_lookup — all already live MCP tools on bth-mcp below, S1/S4/S7).
# Consumers resolve this via
# praxia_workflows::plugin_cli::resolve_plugin_mcp_command_for_capability
# ("readback") rather than naming "bathos" directly — see praxia backlog
# #3499 / PR maraxen/praxia#22.
provides = ["readback"]

[plugin.mcp]
# `bth serve` never existed as a CLI subcommand — the real MCP launch
# mechanism is the `bth-mcp` console-script entry point (pyproject.toml
# [project.scripts]), which starts bathos.mcp:mcp_server() on stdio
# transport. bathos.export.register_mcp() resolves the same binary
# (shutil.which("bth-mcp"), falling back to `uv run --with bathos[mcp]
# bth-mcp`) when writing mcpServers.bathos into a caller's MCP config.
# Fixed as part of debt #619 (MCP write-seam auth hardening).
command = ["bth-mcp"]

# NOTE: `triggers` below is human-readable documentation only — cisternal's
# ManifestAssetSource._load_skills() (assets/manifest.py) reads only `name`
# and `path` from each [[plugin.skills]] entry; `triggers` is never consumed.
# The triggers Claude actually sees come solely from the `description`/
# `triggers` fields in each skill file's own YAML frontmatter (linked below).
# Keep the two in sync by hand until cisternal's loader grows support for
# manifest-declared triggers.
[[plugin.skills]]
name     = "using-bathos"
path     = "agent_assets/skills/using-bathos/SKILL.md"
triggers = ["bth run", "sidecar", "catalog", "controls", "stage_name", "bth init", "bth check"]

[[plugin.skills]]
name     = "bathos-cluster"
path     = "agent_assets/skills/bathos-cluster/SKILL.md"
triggers = ["bth submit", "slurm", "sbatch", "myxcel", "bth sync", "bth remote"]

[[plugin.skills]]
name     = "bathos-campaigns"
path     = "agent_assets/skills/bathos-campaigns/SKILL.md"
triggers = ["bth campaign", "claim", "union gate", "figure manifest", "postmortem", "bth lineage", "bth cite"]

[[plugin.skills]]
name     = "bathos-literature-parity"
path     = "agent_assets/skills/bathos-literature-parity/SKILL.md"
triggers = ["literature parity", "reimplemented baseline", "parity.bth.toml", "reference_parity"]

[[plugin.skills]]
name     = "bathos-mcp"
path     = "agent_assets/skills/bathos-mcp/SKILL.md"
triggers = ["bathos mcp", "BathosErrorCode", "error envelope", "validation_ok"]

[[plugin.skills]]
name     = "bathos-trust-ledger"
path     = "agent_assets/skills/bathos-trust-ledger/SKILL.md"
triggers = ["graduate_product", "register_attestation", "resolve_pin", "get_trust_state", "query_attestation", "GRADUATION_REFUSED", "attestation.bth.toml", "trust_state"]

[[plugin.snippets]]
name           = "bathos-rules"
path           = "agent_assets/snippets/rules.md"
scope          = "project"
scope_detector = "glob:scripts/**/*.bth.toml"

[[plugin.agents]]
name  = "experiment-runner"
path  = "agent_assets/agents/experiment-runner.md"
tools = ["run", "campaign_create", "campaign_review", "check"]

[plugin.dependencies]
myxcel = ">=0.3"
