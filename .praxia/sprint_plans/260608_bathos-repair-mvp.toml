task_id: 260608_bathos-repair-spec

Finalize MCP mirror tools in mcp.py (depends on B, C, D being implemented).

Replace the stubs added in track A with fully wired implementations:

@mcp.tool()
def repair_scan(catalog_dir: str | None = None, tier: str = "all") -> dict:
    '''Scan the catalog for repairable issues without making any changes.
    Returns a list of findings with action type, path, and detail.'''
    from bathos.repair import scan
    actions = scan(catalog_dir=catalog_dir, tier=tier)
    return {"findings": [vars(a) for a in actions], "count": len(actions)}

@mcp.tool()
def repair(
    catalog_dir: str | None = None,
    tier: str = "all",
    dry_run: bool = True,
    acknowledge_warm_loss: bool = False,
) -> dict:
    '''Run catalog repair. dry_run=True (default) is safe; set dry_run=False to apply.
    Pass acknowledge_warm_loss=True only when warm-tier data loss is acceptable.'''
    from bathos.repair import repair as _repair
    manifest = _repair(
        catalog_dir=catalog_dir, tier=tier,
        dry_run=dry_run, acknowledge_warm_loss=acknowledge_warm_loss
    )
    return vars(manifest)

CONSTRAINTS:
- dry_run=True must be the default — safety-critical, per spec
- Tool description strings must accurately describe the dry_run safety semantic
- Both tools accept catalog_dir for test isolation (pass-through only)
- Do not import repair at module level (lazy import inside function body)

KEY FILES:
  src/bathos/mcp.py      — replace stubs, follow existing @mcp.tool() decorator pattern
  src/bathos/repair.py   — the module being mirrored (already implemented in A+B+C+D)
"""
