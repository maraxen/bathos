== AC-12: claim-coverage JSON report ==

Add a new function to campaigns.py:

  emit_claim_coverage_report(
      db,
      catalog_dir: str | Path,
      campaign_id: str,
      verdict: str,
      uncovered_clauses: list[str],
      claim: ClaimFile,
      bypass_reason: str | None = None,
  ) -> None

Logic:
- covered_clauses = [c["id"] for c in claim.union_gate_clauses if c["id"] not in uncovered_clauses]
- total = len(claim.union_gate_clauses)
- coverage_fraction = len(covered_clauses) / total if total > 0 else 1.0
- verdict_blocked = (verdict == "confounded" and bypass_reason is None)
- JSON payload:
    {
      "coverage_fraction": coverage_fraction,
      "covered_clauses": covered_clauses,
      "uncovered_clauses": uncovered_clauses,
      "contradicted_clauses": [],
      "verdict_blocked": verdict_blocked,
      "bypass_reason": bypass_reason
    }
- sidecar_dir = Path(catalog_dir) / "sidecars" / campaign_id
- sidecar_dir.mkdir(parents=True, exist_ok=True)
- filename = f"claim_coverage_{campaign_id}.json"
- atomic write: write to tmp_path = sidecar_dir / (filename + ".tmp"), then tmp_path.rename(sidecar_dir / filename)

Call this from conclude_campaign() (campaigns.py:180) immediately after the union gate block
(after writing claim_mode='bypassed' if applicable). Pass:
- catalog_dir = Path.home() / ".bth" / "catalog"  (or get from compact.get_catalog_dir() if available)
- uncovered from run_union_gate() return value
- bypass_reason = "force_verdict flag" if force_verdict else None

Only call emit_claim_coverage_report when claim_path_rel is set (same guard as the existing union gate block).

== AC-13: [baseline_parity] sub-block lint in validate_claim ==

In src/bathos/claim.py, extend validate_claim() after existing confound checks to handle reference_parity.
For each confound in claim.confounds that has a "reference_parity" key:

  ref_par = confound["reference_parity"]
  parity_run_id = ref_par.get("parity_run_id", "")
  reference_metric = ref_par.get("reference_metric", "")
  reference_value = ref_par.get("reference_value")
  equivalence_bound = ref_par.get("equivalence_bound")
  confound_label = confound.get("label", confound.get("id", "unknown"))

  Three-state dispatch — CRITICAL: do NOT use broad except Exception wrappers that swallow state 2b:

  State 1 — parity_run_id empty or missing:
    result.warnings.append(f"baseline admissibility not established for '{confound_label}'")

  State 2 — parity_run_id set AND db is not None:
    row = db.execute("SELECT metadata FROM runs WHERE id=? OR id LIKE ?",
                     [parity_run_id, parity_run_id + "%"]).fetchone()
    if row is None:
      result.warnings.append(
        f"parity run '{parity_run_id}' not compacted — run `bth compact` to enable baseline parity check"
      )
    else:
      try:
        meta = json.loads(row[0] or "{}")
      except json.JSONDecodeError as e:
        result.errors.append(f"failed to parse run metadata for parity check: {e}")
        continue
      # State 2b — metric missing: hard ERROR, NOT inside broad except
      if reference_metric not in meta:
        result.errors.append(
          f"parity_metric key '{reference_metric}' not found in baseline run metadata — check field name"
        )
      else:
        result_val = float(meta[reference_metric])
        if abs(result_val - reference_value) < equivalence_bound:
          result.infos.append(
            f"baseline parity PASS for '{confound_label}' (|{result_val:.4f} - {reference_value}| < {equivalence_bound})"
          )
        else:
          result.warnings.append(
            f"parity run '{parity_run_id}' does not satisfy equivalence bound for '{confound_label}'"
          )

  State 3 — parity_run_id set, db is None:
    result.infos.append(f"skipping baseline parity check for '{confound_label}' — no catalog connection")

Check whether ValidationResult already has an infos list; add it if not.

