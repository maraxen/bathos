Signal 10 -- submit_bypass_rate (sprint_audit.py:191-286):
  Fraction of validation/production CLUSTER runs (slurm_job_id populated) that have no
  matching submit-provenance record (joined on runs.slurm_job_id = submits.myxcel_job_id).
  Provenance Parquet at: ~/.bth/catalog/submits/<project_slug>/**/*.parquet
