Path: <catalog>/sidecars/<campaign_id>/figure_manifest.json

Python classes (figure_manifest.py):
  class RenderState(StrEnum): READY = "ready" / DEFERRED = "deferred"

  class InputPin(BaseModel):
      run_id: str           # bathos run ID
      output_path: str      # path to data file in catalog
      sha256: str           # immutability guarantee

  class FigureEntry(BaseModel):
      figure_id: str              # unique slug
      intent: str                 # e.g. "main result", "supplementary ablation"
      input_pins: list[InputPin]
      render_state: RenderState   # ready | deferred
      figure_kind: str | None = None  # e.g. "analysis_chart"; None=unclassified

