def check_reproduction_prerequisite(
    requires_pass_stem: str,
    catalog_dir: Path,
) -> bool:
    # Returns True if a passing run of requires_pass_stem exists. False otherwise.
    db_path = catalog_dir / "bathos.db"
    if db_path.exists():
        # Warm path — exact same idiom as check_first_of_kind at prereg.py:158
        try:
            with duckdb.connect(str(db_path), read_only=True) as conn:
                row = conn.execute(
                    "SELECT 1 FROM runs WHERE command LIKE ? AND outcome = 'pass' LIMIT 1",
                    ["%" + requires_pass_stem + "%"]
                ).fetchone()
                if row:
                    return True
        except Exception:
            pass  # fall through to cool-tier
    # Cool-tier fallback — pyarrow glob scan (following catalog.py:43 + prereg.py:168-175)
    import pyarrow.parquet as pq
    for fragment in sorted(catalog_dir.glob("runs/**/*.parquet")):
        try:
            tbl = pq.read_table(str(fragment), columns=["command", "outcome"])
            for row in tbl.to_pydict()["command"]:
                pass  # just to validate it reads
            # Filter rows where command contains stem and outcome == 'pass'
            cmds = tbl.column("command").to_pylist()
            outcomes = tbl.column("outcome").to_pylist()
            for cmd, outcome in zip(cmds, outcomes):
                if cmd and requires_pass_stem in cmd and outcome == "pass":
                    return True
        except Exception:
            continue
    return False

