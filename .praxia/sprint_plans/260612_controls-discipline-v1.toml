  requires_pass_stem = ""
  if sidecar and sidecar.reproduction:
      requires_pass_stem = sidecar.reproduction.requires_pass_stem or ""

  if requires_pass_stem:
      stage = sidecar.stage_name if sidecar else "exploration"
      if stage in ("validation", "production"):
          found = check_reproduction_prerequisite(requires_pass_stem, catalog_dir)
          if not found:
