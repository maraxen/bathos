def check_baseline_ref_exists(project_slug: str, catalog_dir: Path, db_path: Path) -> list[LintIssue]:
    issues = []
    # Scan all benchmark sidecars for non-empty baseline_ref
    for sidecar_path in find_benchmark_sidecars(project_slug, catalog_dir):
        sidecar = parse_sidecar(sidecar_path)
        baseline_ref = getattr(sidecar, "baseline_ref", "") or ""
        if not baseline_ref:
            continue
        # Query warm DuckDB: SELECT outcome, started_at FROM runs WHERE id = ? OR id LIKE ? LIMIT 1
        # with parameters: (baseline_ref, baseline_ref + '%')  — supports full UUIDs and short prefixes
        with duckdb.connect(str(db_path), read_only=True) as conn:
            row = conn.execute(
                "SELECT outcome, started_at FROM runs WHERE id = ? OR id LIKE ? LIMIT 1",
                [baseline_ref, baseline_ref + "%"]
            ).fetchone()
        if row is None:
            issues.append(LintIssue(
                level="WARNING",
                code="BASELINE_REF_NOT_FOUND",
                message=f"baseline_ref {baseline_ref!r} not found in warm-tier catalog",
                sidecar_path=str(sidecar_path),
            ))
        else:
            # Emit INFO confirming the baseline run exists
            issues.append(LintIssue(
                level="INFO",
                code="BASELINE_REF_OK",
                message=f"baseline_ref {baseline_ref!r}: outcome={row[0]}, started_at={row[1]}",
                sidecar_path=str(sidecar_path),
            ))
    return issues

