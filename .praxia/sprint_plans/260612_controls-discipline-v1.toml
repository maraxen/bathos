PART 2 — Signal 10 submit_bypass_rate (sprint_audit.py):

def signal_submit_bypass_rate(project_slug: str, db_path: Path, catalog_dir: Path) -> SignalResult:
    # Signal 10: submit_bypass_rate — fraction of validation/production runs with no submit provenance.
    import pyarrow.parquet as pq as pq_mod
    provenance_dir = catalog_dir / "submits" / project_slug
    if not provenance_dir.exists() or not db_path.exists():
        return SignalResult(signal="submit_bypass_rate", value=None, level="INFO",
                           message="no submit provenance records yet")

    # Load all provenance records
    prov_files = list(provenance_dir.glob("**/*.parquet"))
    if not prov_files:
        return SignalResult(...)

    prov_table = pq_mod.read_table([str(f) for f in prov_files])
    submitted_job_ids = set(prov_table.column("myxcel_job_id").to_pylist())

    with duckdb.connect(str(db_path), read_only=True) as conn:
        # Get validation/production runs with slurm_job_id populated
        sql = (
            "SELECT slurm_job_id FROM runs"
            " WHERE project_slug = ?"
            " AND stage_name IN ('validation', 'production')"
            " AND slurm_job_id IS NOT NULL AND slurm_job_id != ''"
        )
        rows = conn.execute(sql, [project_slug]).fetchall()

    if not rows:
        return SignalResult(signal="submit_bypass_rate", value=0.0, level="OK",
                           message="no validation/production cluster runs found")

    total = len(rows)
    bypassed = sum(1 for (jid,) in rows if jid not in submitted_job_ids)
    rate = bypassed / total

    level = "WARNING" if rate > 0.05 else "OK"
    message = f"submit_bypass_rate={rate:.2%} ({bypassed}/{total} validation/production runs bypassed bth submit)"
    return SignalResult(signal="submit_bypass_rate", value=rate, level=level, message=message)

