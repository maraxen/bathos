## Step 2 — New claim.py module (AC-01, AC-02, AC-03, AC-07)

Create `src/bathos/claim.py` following the exact structure of `postmortem.py`.

**ClaimFile dataclass** (mirrors PostmortemFile):
```python
@dataclass
class ClaimFile:
    headline: str
    kill_condition: str
    regime: Optional[str]
    hypotheses: list[dict]  # each: {id, label, predicted_signature?}
    assumptions: list[dict]
    confounds: list[dict]
    discriminability: list[dict]  # [[claim.discriminability]] entries
    union_gate_clauses: list[dict]  # each: {id, description, hypothesis_ids: list[str]}
    path: Path
    sha256: str
```

**parse_claim(path: Path) -> ClaimFile** — reads TOML, extracts all sections,
computes SHA256 of file content.

**validate_claim(claim: ClaimFile, db=None) -> ValidationResult** (mirrors validate_postmortem):
- Missing headline → ERROR
- Blank kill_condition → ERROR
- Fewer than 2 [[hypotheses]] entries → ERROR
- No hypothesis with id containing "null" or "misspec" → WARNING
- Any [[hypotheses]] or [[confounds]] entry with id matching r'^[A-Z][0-9]+$' and
  no label field or blank label → WARNING (use label in warning message text, AC-14)
- Any [[claim.discriminability]] entry missing predicted_outcome → ERROR
- If db provided (AC-07 regime check):
  - Read claim.regime; if set, query warm catalog for union of result_schema grid values
    across runs in campaigns linked to this claim file path
  - If union does not cover regime → WARNING "disconfirming regime excluded — claim.regime [X] not covered by any run"

**scaffold_claim(campaign_id: str, db, workspace_root: Path) -> Path**:
- Look up campaign by id in db (name, mode)
- Create .bth/claims/ dir if needed
- Write .bth/claims/<campaign_name>.claim.toml template with all required sections stubbed
- Print sidecar snippet showing discriminates and isolates fields pre-populated with hypothesis ID placeholders
- Return the created path

**register_claim(path: Path, campaign_id: str, db, workspace_root: Path, force: bool = False)**:
- Reject absolute paths: if path.is_absolute() → ERROR "store relative to workspace root"
- Resolve against workspace_root for existence check
- SHA256 = hashlib.sha256((workspace_root / path).read_bytes()).hexdigest()
- If campaigns.claim_sha256 already set and not force → raise error with re-register instruction
- If force → insert audit event into amendments table (keyed by campaign_id + timestamp)
- UPDATE campaigns SET claim_path=str(path), claim_sha256=sha256 WHERE id=campaign_id

**run_union_gate(db, campaign_id: str, claim: ClaimFile) -> tuple[str, list[str]]**:
- For each clause in claim.union_gate_clauses:
  - For each h_id in clause["hypothesis_ids"]:
    - Query runs WHERE campaign_id=... AND json_contains(claim_discriminates, '"<h_id>"')
  - If no single run covers ALL hypothesis_ids → uncovered_clauses.append(clause["id"])
- Return ("confounded", uncovered) if uncovered else ("covered", [])

**check_sha(path_relative: str, registered_sha: str, workspace_root: Path) -> None**:
- abs_path = workspace_root / path_relative
- If not abs_path.exists() → raise FileNotFoundError(f"claim.bth.toml not found at {abs_path}")
- current_sha = hashlib.sha256(abs_path.read_bytes()).hexdigest()
- If current_sha != registered_sha → raise ValueError(
    "claim.bth.toml has been modified since registration — re-register with `bth claim register --force`")

## Step 3 — conclude_campaign() extension (AC-08, AC-09, AC-11)

In campaigns.py, extend conclude_campaign signature:
  conclude_campaign(db, campaign_id, outcome_label, conclusion, workspace_root=None, force_verdict=False)

After existing logic (before writing the final UPDATE), add:

```python
from bathos.claim import parse_claim, run_union_gate, check_sha, FileNotFoundError as ClaimNotFound
from bathos.workspace import resolve_workspace

row = db.execute(
    "SELECT claim_path, claim_sha256, mode FROM campaigns WHERE id=?", [campaign_id]
).fetchone()
if row and row[0]:
    claim_path_rel, registered_sha, mode = row[0], row[1], row[2]
    if workspace_root is None:
        workspace_root = resolve_workspace(Path.cwd()).fs_root
    abs_path = workspace_root / claim_path_rel
    if not abs_path.exists():
        raise RuntimeError(
            f"claim.bth.toml not found at {abs_path} — file may have been moved or deleted. "
            "Set BTH_WORKSPACE_ROOT or pass workspace_root to locate it."
        )
    check_sha(claim_path_rel, registered_sha, workspace_root)  # raises ValueError on mismatch
    claim = parse_claim(abs_path)
    verdict, uncovered = run_union_gate(db, campaign_id, claim)
    if uncovered:
        if force_verdict:
            db.execute("UPDATE campaigns SET claim_mode='bypassed' WHERE id=?", [campaign_id])
            print(f"WARNING: Union Gate bypassed — unmapped clauses: {uncovered}")
        elif mode in ("confirmation", "sequential"):
            outcome_label = "confounded"
            print(f"Union Gate: verdict downgraded to 'confounded' — unmapped clauses: {uncovered}")
        else:
            print(f"WARNING: Union Gate — unmapped clauses: {uncovered} (exploration mode, no downgrade)")
```

Expose `--force-verdict / --no-force-verdict` flag on the `bth campaign conclude` Typer command in cli.py.

