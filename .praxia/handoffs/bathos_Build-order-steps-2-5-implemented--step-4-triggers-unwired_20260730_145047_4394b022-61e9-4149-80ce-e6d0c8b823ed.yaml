open_questions:
- When should BTH_REVIEW_COVERAGE_ENFORCE be turned on? It needs real [review] entries to exist first, which needs someone to author them on a live experiment. Nothing currently prompts that.
- Should the obligation triggers be wired behind a single flag, or should each of the four be independently toggleable? Trigger 4 (citation_contradicted) is the highest-value and the safest, since it only fires where a [review] entry already exists; triggers 1-3 fire on pre-existing runs.
- Does discriminability need to become mandatory for confirmatory claims? It is optional (claim.py defaults it to []), so citation_contradicted returns 'indeterminate' for every citation on a claim with an empty map — a silent coverage hole §10 item 1 already flags.
- 'Should praxia PR #62 (merged, plan_audit verification-probe) get a retrospective code review? It was merged unreviewed; only its tests were verified.'
