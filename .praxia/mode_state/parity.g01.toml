# WP17 parity gate mode-state record for G01 (PF1 schema and declaration validation).

[feature]
name = "parity.g01"
description = "G01: parity declaration schema, three-part schema_version, and non-empty planned cell set"
version = "0.1.0"

[ladder]
current_stage = "shadow"

[shadow]
traffic_fraction = 1.0
writes_isolated = true
writes_isolated_enforced_by = "tests/test_parity_gate_ladder.py::test_parity_gate_shadow_writes_isolated"

[scoring]
positive_label = true

[promotion]
target_stage = "advisory"
min_verdicts = 60
min_labels = 60
allowed_label_sources = ["frozen_gold", "owner_confirmed", "at_work"]
min_precision_lower_bound = 0.90
min_recall_lower_bound = 0.90
isolation_violations_max = 0
threshold_basis = "Spec 261123 §7.7 D2: PF1 family pooled 95% Clopper-Pearson lower bound >= 0.90 on precision and recall over >= 30 positive + 30 negative labelled cases (with >= 3 positive and >= 1 negative exercising G01 with zero misses)."
