# Bearings shadow gate (spec 261104 T7; plan .praxia/docs/plans/261111_bearings-slice3-shadow.md).
# Pre-registered 261111 before any verdict was emitted. Items come from bathos.bearings.shadow.derive; check with
# `bth bearings shadow-check`. Arm: three blind readers per packet.

[feature]
name = "bearings.readers.silent"
description = "Silent purposes: live charter purposes no reader maps (T7(b)) against purposes no shown labelled sidecar serves"
version = "0.2.0"  # 261112: evidence rules (earliest at-work label, disjoint packet windows, sidecars with >2 slugs disputed, unmatchable ids invalid); unlabelled-sidecar packets unscored; new floor n_present >= 8 (owner 261112)

[ladder]
current_stage = "shadow"

[shadow]
traffic_fraction = 1.0
writes_isolated = true
writes_isolated_enforced_by = "tests/test_bearings_shadow.py::test_shadow_reader_isolation"

[scoring]
positive_label = true

[promotion]
target_stage = "advisory"
min_verdicts = 8
min_labels = 8
allowed_label_sources = ["frozen_gold", "owner_confirmed", "at_work"]
min_recall = 0.8
min_recall_lower_bound = 0.65
max_fp_rate = 0.2
isolation_violations_max = 0
threshold_basis = "AC-9 silent recall >= 0.8 (recall) and false-silent <= 0.2 (false-positive rate), the owner's bars in scripts/analysis/replay_bearings_ac9.bth.toml (T7, 261109), on the point estimate; plus a Wilson 95% lower bound of at least 0.65 (owner 261111, AskUserQuestion), which a perfect record reaches only with 8 or more items. Only at-work labels against the charter confirmed 261110 or later count; the 311 retrospective overlay labels are excluded. False-silent is read only with at least 8 present purposes (owner 261112, AskUserQuestion, review 261111 F3); cisternal has no key for it, so bathos.bearings.shadow.MIN_PRESENT enforces it in bth bearings shadow-check."
