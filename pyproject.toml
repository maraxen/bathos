[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bathos"
version = "0.13.0a6"
description = "Local-first, zero-server experiment tracking for researchers"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Marielle Russo", email = "mariellexr@gmail.com" },
]
license = { text = "Apache 2.0" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Monitoring",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    # Prerelease floor: every client sharing ~/.bth/catalog/bathos.db must read
    # DuckDB storage v69+. Unlike [tool.uv] below, a floor here is honoured by
    # `uv tool install`, PyPI installs and dependents (see [tool.uv] comment).
    "duckdb>=2.0.0.dev2610011535",
    "pyarrow>=16",
    "pytz>=2026.2",
    "tomlkit>=0.12",
    "toml>=0.10",
    "rich>=13",
    "fastmcp>=3.3.1",
    # 0.1.1a8: capture_git_state withholds an unverified sidecar/env sha
    # (hash="unknown") unless a schema-v2 tree manifest verifies (praxia debt #2058).
    # 0.1.1a9: a dangling .git gitfile no longer hides a verified sidecar
    # (praxia debt #2100).
    # 0.1.1a10: verify_tree exempts untracked bathos lock manifests
    # (<stem>.bth.<uuid>.bth.lock.toml) from the tree-manifest "extras" check.
    # 0.1.1a13: cisternal.plugin -- the `bth plugin install|update|export|info`
    # sub-app and packaged bundle snapshots (src/bathos/agent_plugin.json).
    # 0.1.1a14: `bth plugin repo-bundle` (plugin/ + .claude-plugin/marketplace.json,
    # installable from GitHub) and [plugin.mcp] launch = "uvx".
    "cisternal>=0.1.1a14",
    # backlog #4702: bathos/cli_cyclopts.py (the real `bth` CLI as of the final
    # cutover) wires directly against cisternal's cyclopts-based wire() --
    # declared here since it's imported directly, not just pulled in
    # transitively via cisternal.
    "cyclopts>=4.18.0",
    # Already present transitively via fastmcp and already imported directly by
    # figure_manifest.py and campaign_report.py -- declared here so the authoring
    # payload models do not rest on an undeclared transitive dependency.
    "pydantic>=2.7",
]

[project.optional-dependencies]
viz = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "httpx>=0.28.1",
]
stats = [
    "scipy>=1.11",
]
docs = [
    "sphinx>=7",
]
dev = [
    "pytest>=8",
    "pytest-tmp-files>=0.0.2",
    "pytest-json-report>=1.5",
    "pytest-cov>=5",
    "ruff>=0.6",
    "ty>=0.0.1a21",
]
[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-tmp-files>=0.0.2",
    "pytest-json-report>=1.5",
    "pytest-cov>=5",
    "ruff>=0.6",
    "ty>=0.0.1a21",
]

[project.urls]
Homepage = "https://github.com/mariellerossi/bathos"
Documentation = "https://bathos.readthedocs.io"
Repository = "https://github.com/mariellerossi/bathos.git"
"Bug Tracker" = "https://github.com/mariellerossi/bathos/issues"

[project.scripts]
bth = "bathos.cli_cyclopts:app"
bth-mcp = "bathos.mcp:mcp_server"

[tool.uv]
# Prereleases are REQUIRED, not merely tolerated.
#
# bathos depends on cisternal, which ships only as a pre-release (0.1.1aN), and
# bathos itself is 0.13.0aN. Without this, a `uv tool install` of bathos resolves
# duckdb to the newest STABLE release while consumers that do allow prereleases
# (maraxiom's tool, affigit's workspace) resolve a duckdb dev build instead.
#
# That split is not cosmetic: every bathos install shares ONE warm catalog at
# ~/.bth/catalog/bathos.db, and DuckDB upgrades a file's storage version on write
# but refuses to read a version newer than the client supports. Measured
# 2026-10-13 on this machine -- maraxiom's venv (duckdb 2.0.0.dev2610011535, via
# prerelease = "allow") had written the catalog at storage version 69, while the
# standalone bathos tool resolved stable duckdb 1.5.6, which reads only 64-68.
# Result: `bth sql`, `bth show` and the get_run MCP tool all failed identically
# with "Trying to read a database file with version number 69, but we can only
# read versions between 64 and 68" -- for ~a day, on a machine where nothing was
# actually wrong and no data was lost (the cool-tier parquet was intact
# throughout). Runs could not be verified by record, which is the one check this
# project's own rules insist on over exit codes.
#
# Scope (spiked 2026-10-15, uv 0.11.21): this setting is honoured only when uv
# resolves THIS project (`uv lock` / `uv sync` / `uv run` in the repo). It is
# ignored by `uv tool install` (of a dir or a wheel, from any cwd) and by any
# project that depends on bathos. The guarantee that every client sharing the
# catalog stays on a mutually readable storage version therefore comes from the
# duckdb prerelease floor in [project.dependencies]; this setting keeps the
# repo's own resolution (cisternal 0.1.1aN etc.) prerelease-inclusive.
prerelease = "allow"

[tool.hatch.build.targets.wheel]
packages = ["src/bathos"]
include = [
  "src/bathos/viz/templates/index.html",
  "src/bathos/viz/templates/_runs.html",
  "src/bathos/viz/templates/_run_detail.html",
  "src/bathos/viz/templates/_campaign.html",
  "src/bathos/viz/static/alpine.min.js",
  "src/bathos/viz/static/pico.min.css",
  "src/bathos/viz/static/VERSIONS.md",
  # `bth plugin install` reads this on wheel installs (no .praxia/ on disk).
  "src/bathos/agent_plugin.json",
]

[tool.hatch.build.targets.wheel.force-include]
"agent_assets" = "bathos/agent_assets"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--json-report --json-report-file=tmp/pytest.json -q"
markers = [
    "slow: a longer, opt-in sweep (e.g. AC-17's wider seed sweep); not run by default",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "ARG", "SIM"]
ignore = ["E501"]

# ty replaces the pyright config removed in #38. pyright was configured at v0.1.0
# scaffolding and never once executed — an earlier CI step always failed first, so
# its step reported `skipped` and read as green. The lesson taken from that is that
# a type gate is worth nothing unless it can fail the build, so this one is wired to
# block rather than advise.
#
# The ratchet: `src/` has 52 diagnostics today, which is too many to fix alongside
# turning the gate on. Rather than start non-blocking (the failure mode above),
# every rule that is ALREADY clean is left at its default severity and therefore
# gates; the nine rules that are currently dirty are demoted to `warn` so they stay
# visible without blocking. Fixing a rule's backlog means deleting its line here.
# Counts are as of this commit — see the backlog item for the cleanup.
#
# `unknown-argument` is deliberately NOT demoted. Its single occurrence was a real
# bug (the MCP `archive` tool passed `keep_cool=` to a function with no such
# parameter, so every call raised TypeError into an error envelope), fixed in this
# same commit. Passing an argument nothing accepts is the defect class that has now
# bitten this repo twice — the three dead CLI flags in #39 were the same shape — so
# it gates from day one.
[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
include = ["src/**/*.py"]

[tool.ty.terminal]
# ty exits non-zero on *any* diagnostic by default, warnings included, which would
# make the demotions below pointless — the gate would fail on all 51 regardless.
# Warnings stay printed in the CI log and in the editor; only errors block.
error-on-warning = false

[tool.ty.rules]
invalid-argument-type = "warn"       # 26
unresolved-attribute = "warn"        # 9
not-subscriptable = "warn"           # 6
unused-type-ignore-comment = "warn"  # 3
unsupported-operator = "warn"        # 2
invalid-return-type = "warn"         # 2
invalid-assignment = "warn"          # 2
call-non-callable = "warn"           # 1 — `app.run()`; ty cannot resolve the cisternal app type
