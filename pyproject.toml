[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bathos"
version = "0.13.0a3"
description = "Local-first, zero-server experiment tracking for researchers"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Marielle Russo", email = "mariellexr@gmail.com" },
]
license = { text = "Apache 2.0" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Monitoring",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "typer>=0.12",
    "duckdb>=1.0",
    "pyarrow>=16",
    "pytz>=2026.2",
    "tomlkit>=0.12",
    "toml>=0.10",
    "rich>=13",
    "fastmcp>=3.3.1",
    "cisternal>=0.1.1a3",
    # Already present transitively via fastmcp and already imported directly by
    # figure_manifest.py and campaign_report.py -- declared here so the authoring
    # payload models do not rest on an undeclared transitive dependency.
    "pydantic>=2.7",
]

# TEMPORARY dev-time override: cisternal's provenance module (this PR depends on
# it) isn't released yet -- lives in maraxen/cisternal PR #32
# (feat/provenance-module), unmerged as of this commit. Remove this section and
# bump the version pin above to a real released version once that PR merges.
[tool.uv.sources]
cisternal = { path = "../cisternal", editable = true }

[project.optional-dependencies]
viz = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "httpx>=0.28.1",
]
stats = [
    "scipy>=1.11",
]
docs = [
    "sphinx>=7",
]
dev = [
    "pytest>=8",
    "pytest-tmp-files>=0.0.2",
    "pytest-json-report>=1.5",
    "pytest-cov>=5",
    "ruff>=0.6",
    "ty>=0.0.1a21",
]
[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-tmp-files>=0.0.2",
    "pytest-json-report>=1.5",
    "pytest-cov>=5",
    "ruff>=0.6",
    "ty>=0.0.1a21",
]

[project.urls]
Homepage = "https://github.com/mariellerossi/bathos"
Documentation = "https://bathos.readthedocs.io"
Repository = "https://github.com/mariellerossi/bathos.git"
"Bug Tracker" = "https://github.com/mariellerossi/bathos/issues"

[project.scripts]
bth = "bathos.cli:app"
bth-mcp = "bathos.mcp:mcp_server"

[tool.hatch.build.targets.wheel]
packages = ["src/bathos"]
include = [
  "src/bathos/viz/templates/index.html",
  "src/bathos/viz/templates/_runs.html",
  "src/bathos/viz/templates/_run_detail.html",
  "src/bathos/viz/templates/_campaign.html",
  "src/bathos/viz/static/alpine.min.js",
  "src/bathos/viz/static/pico.min.css",
  "src/bathos/viz/static/VERSIONS.md",
]

[tool.hatch.build.targets.wheel.force-include]
"agent_assets" = "bathos/agent_assets"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--json-report --json-report-file=tmp/pytest.json -q"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "ARG", "SIM"]
ignore = ["E501"]

# ty replaces the pyright config removed in #38. pyright was configured at v0.1.0
# scaffolding and never once executed — an earlier CI step always failed first, so
# its step reported `skipped` and read as green. The lesson taken from that is that
# a type gate is worth nothing unless it can fail the build, so this one is wired to
# block rather than advise.
#
# The ratchet: `src/` has 52 diagnostics today, which is too many to fix alongside
# turning the gate on. Rather than start non-blocking (the failure mode above),
# every rule that is ALREADY clean is left at its default severity and therefore
# gates; the nine rules that are currently dirty are demoted to `warn` so they stay
# visible without blocking. Fixing a rule's backlog means deleting its line here.
# Counts are as of this commit — see the backlog item for the cleanup.
#
# `unknown-argument` is deliberately NOT demoted. Its single occurrence was a real
# bug (the MCP `archive` tool passed `keep_cool=` to a function with no such
# parameter, so every call raised TypeError into an error envelope), fixed in this
# same commit. Passing an argument nothing accepts is the defect class that has now
# bitten this repo twice — the three dead CLI flags in #39 were the same shape — so
# it gates from day one.
[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
include = ["src/**/*.py"]

[tool.ty.terminal]
# ty exits non-zero on *any* diagnostic by default, warnings included, which would
# make the demotions below pointless — the gate would fail on all 51 regardless.
# Warnings stay printed in the CI log and in the editor; only errors block.
error-on-warning = false

[tool.ty.rules]
invalid-argument-type = "warn"       # 26
unresolved-attribute = "warn"        # 9
not-subscriptable = "warn"           # 6
unused-type-ignore-comment = "warn"  # 3
unsupported-operator = "warn"        # 2
invalid-return-type = "warn"         # 2
invalid-assignment = "warn"          # 2
call-non-callable = "warn"           # 1 — `app.run()`; ty cannot resolve the cisternal app type
